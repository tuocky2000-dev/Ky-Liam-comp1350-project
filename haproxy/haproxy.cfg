global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:8080
    stats enable
    stats uri /stats
    stats refresh 5s
    default_backend app_servers

backend app_servers
    balance roundrobin
    server backend1 127.0.0.1:3000 check
    server backend2 127.0.0.1:3001 check
