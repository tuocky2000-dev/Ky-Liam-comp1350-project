global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

# Frontend receiving incoming traffic forwarded by Nginx reverse proxy
frontend http_front
    bind *:8080
    # Enable web-based monitoring dashboard at /stats
    stats enable
    stats uri /stats
    stats refresh 5s
    default_backend app_servers

# Backend pool distributing requests across PM2 Node.js instances
backend app_servers
    # Distribute traffic evenly using round-robin algorithm
    balance roundrobin
    # Active health checks on backend instances running on ports 3001 and 3002
    server backend1 127.0.0.1:3001 check
    server backend2 127.0.0.1:3002 check

